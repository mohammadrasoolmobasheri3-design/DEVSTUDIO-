name: DevStudio Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

            - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q DevStudio_V12_1_github-actions-trial.zip -d extracted

          echo "Searching for a valid Gradle project..."

          GRADLEW=""
          while IFS= read -r candidate; do
            project="$(dirname "$candidate")"
            if [ -f "$project/gradle/wrapper/gradle-wrapper.jar" ]; then
              GRADLEW="$candidate"
              PROJECT_DIR="$project"
              break
            fi
          done < <(find extracted -type f -name gradlew)

          if [ -z "$GRADLEW" ]; then
            echo "Could not find gradlew with its wrapper JAR"
            find extracted -type f \( -name gradlew -o -name gradle-wrapper.jar \)
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          ls -l "$PROJECT_DIR/gradle/wrapper/"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java version for SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/output/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DevStudio-debug-apk
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
